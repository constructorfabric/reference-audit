# The offline test suite: every database and LLM call is mocked or replayed from recorded fixtures.
# Tests that need a live service are deselected by marker (see docs/development.md):
#   clickhouse     — the local ClickHouse mirror
#   grobid         — a running GROBID service
#   pdf_build      — a local TeX Live toolchain
#   hallmark_live  — auditing the whole copied HALLMARK corpus (network + LLM, an hour or more)
# The two benchmarks/hallmark_bench.py tests that need the HALLMARK checkout skip with a reason.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Never pick up live LLM settings; the offline tests must not need a key.
      USE_LLM: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project and its dev dependencies
        # uv reads the Python version from .python-version.
        run: uv sync --locked

      - name: Run the offline tests
        run: >-
          uv run --locked pytest -rs
          -m "not clickhouse and not grobid and not pdf_build and not hallmark_live"
